version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - pip install aws-sam-cli

  pre_build:
    commands:
      - pip install -r code/espn/requirements.txt || true
      - pip install -r code/deepl/requirements.txt
      - pip install -r code/spotify/requirements.txt
      - python -m pytest code/tests/ -v

  build:
    commands:
      - sam build --template code/template.yaml --build-dir .aws-sam/build
      - sam package
          --template-file .aws-sam/build/template.yaml
          --output-template-file packaged.yaml
          --s3-bucket $ARTIFACT_BUCKET
          --s3-prefix sam-packages

  post_build:
    commands:
      - echo "SAM package complete."

artifacts:
  files:
    - packaged.yaml
    - infrastructure/**/*
  discard-paths: no
